<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccer-Bench Replay</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --border: #dedbd2; --text: #1f1e1b; --muted: #6b675e;
  --pitch: #3f7d4f; --pitch-line: rgba(255,255,255,.75); --goal: rgba(255,255,255,.35);
  --team-a: #2f6fdb; --team-b: #e0692d; --ball: #ffffff; --ball-edge: #1f1e1b;
  --pass: rgba(255,255,255,.9); --accent: #2f6fdb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --surface: #201f1c; --border: #34322d; --text: #ecebe6; --muted: #9c988e;
    --pitch: #284f33; --pitch-line: rgba(255,255,255,.55); --goal: rgba(255,255,255,.2);
    --team-a: #6c9cf0; --team-b: #f08a52; --ball: #ffffff; --ball-edge: #000000;
    --pass: rgba(255,255,255,.75); --accent: #6c9cf0;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --surface: #201f1c; --border: #34322d; --text: #ecebe6; --muted: #9c988e;
  --pitch: #284f33; --pitch-line: rgba(255,255,255,.55); --goal: rgba(255,255,255,.2);
  --team-a: #6c9cf0; --team-b: #f08a52; --ball: #ffffff; --ball-edge: #000000;
  --pass: rgba(255,255,255,.75); --accent: #6c9cf0;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.team { display: flex; align-items: center; gap: 8px; min-width: 0; }
.team .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.team .name { font-weight: 600; }
.team .spec { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.scoreboard { font-variant-numeric: tabular-nums; text-align: center; }
.scoreboard .score { font-size: 28px; font-weight: 700; letter-spacing: .02em; }
.scoreboard .clock { color: var(--muted); font-size: 12px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
.pitch-card { padding: 10px; }
canvas { display: block; width: 100%; height: auto; border-radius: 6px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 2px 2px; }
button, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
input[type=range] { flex: 1 1 200px; accent-color: var(--accent); }
label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.list { max-height: 300px; overflow-y: auto; }
.row { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
.row:last-child { border-bottom: none; }
.row .t { color: var(--muted); font-variant-numeric: tabular-nums; }
.row.click { cursor: pointer; }
.row.click:hover { background: var(--bg); }
.row.goal { font-weight: 600; }
.err { color: var(--team-b); }
.say { font-style: italic; overflow-wrap: anywhere; }
.tag { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.muted { color: var(--muted); }
kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.chat { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (max-width: 900px) and (min-width: 560px) { .chat { grid-template-columns: 1fr 1fr; } }
.chat-col { padding: 8px 12px 10px; min-width: 0; min-height: 132px; }
.chat-col h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.line { display: grid; grid-template-columns: 28px 1fr; gap: 6px; font-size: 13px; padding: 2px 0; }
.line .who { font-weight: 600; font-variant-numeric: tabular-nums; }
.line .what { overflow-wrap: anywhere; }
.line.quiet .what { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<main>
  <header>
    <div class="team"><span class="dot" style="background:var(--team-a)"></span><div><div class="name" id="nameA"></div><div class="spec" id="specA"></div></div></div>
    <div class="scoreboard"><div class="score" id="score">0 - 0</div><div class="clock" id="clock"></div></div>
    <div class="team" style="justify-content:flex-end;text-align:right"><div><div class="name" id="nameB"></div><div class="spec" id="specB"></div></div><span class="dot" style="background:var(--team-b)"></span></div>
  </header>
  <div class="layout">
    <div class="card pitch-card">
      <canvas id="pitch" aria-label="Match replay"></canvas>
      <div class="controls">
        <button id="play">Play</button>
        <button id="prev" title="Previous tick">&#8592;</button>
        <button id="next" title="Next tick">&#8594;</button>
        <input type="range" id="scrub" min="0" value="0" aria-label="Timeline">
        <select id="speed" aria-label="Speed"><option value="0.5">0.5x</option><option value="1">1x</option><option value="2" selected>2x</option><option value="4">4x</option><option value="8">8x</option></select>
        <label><input type="checkbox" id="targets" checked> targets</label>
        <label><input type="checkbox" id="shouts"> shouts on pitch</label>
      </div>
      <div class="muted" style="font-size:12px;padding:6px 2px 0"><kbd>space</kbd> play/pause &nbsp; <kbd>&larr;</kbd><kbd>&rarr;</kbd> step one tick. Dashed lines are this tick's move targets; solid lines are passes. Shouts made on a tick are heard by teammates on the next one.</div>
    </div>
    <div class="side">
      <div class="chat" aria-live="polite">
        <div class="card chat-col"><h3><span class="tag" style="background:var(--team-a)"></span><span id="chatTitleA">Team A shouts</span></h3><div id="chatA"></div></div>
        <div class="card chat-col"><h3><span class="tag" style="background:var(--team-b)"></span><span id="chatTitleB">Team B shouts</span></h3><div id="chatB"></div></div>
      </div>
      <div class="card"><h2>Key events</h2><div class="list" id="events"></div></div>
      <div class="card"><h2 id="actionsTitle">Actions</h2><div class="list" id="actions"></div></div>
    </div>
  </div>
</main>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const C = D.config, F = D.frames, T = D.ticks, N = C.n_per_team;
// Per-frame lookups: which tick a frame belongs to, and the score shown on it (a goal
// only counts from the frame where the ball actually went in).
const frameTick = new Array(F.length), frameScore = new Array(F.length);
// Frames where the ball crosses the line: playback holds there so a goal doesn't flash
// straight into the kickoff reset.
const goalFrames = new Map();
const GOAL_HOLD_MS = 500;
T.forEach((t, k) => {
  const end = k + 1 < T.length ? T[k + 1].f0 : F.length;
  const before = k > 0 ? T[k - 1].score : [0, 0];
  const goal = t.events.find(e => e.type === 'goal');
  const goalAt = goal ? t.f0 + (goal.frame ?? end - t.f0 - 1) : Infinity;
  if (goal) goalFrames.set(Math.min(goalAt, end - 1), goal);
  for (let i = t.f0; i < end; i++) { frameTick[i] = k; frameScore[i] = i >= goalAt ? t.score : before; }
});
const $ = id => document.getElementById(id);
const names = [...Array(2 * N)].map((_, g) => (g < N ? 'A' : 'B') + (g % N));
for (const s of ['A', 'B']) {
  $('name' + s).textContent = `Team ${s} · ${D.labels[s]}`;
  const specs = D.teams[s]; $('spec' + s).textContent = specs.every(x => x === specs[0]) ? specs[0] : specs.join(', ');
}
const canvas = $('pitch'), ctx = canvas.getContext('2d');
const scrub = $('scrub'); scrub.max = F.length - 1;
// `pos` is the fractional playback position; draw() always renders the whole frame at idx().
let pos = 0, playing = false, last = 0, holdUntil = 0, restart = false;
const idx = () => Math.max(0, Math.min(F.length - 1, Math.floor(pos)));
const css = () => { const s = getComputedStyle(document.documentElement); return k => s.getPropertyValue(k).trim(); };

function resize() {
  const w = canvas.clientWidth, pad = 4, h = w * (C.height + 2 * pad) / (C.width + 2 * pad);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = w * dpr; canvas.height = h * dpr; canvas.style.height = h + 'px';
  draw();
}
function draw() {
  const v = css(), dpr = window.devicePixelRatio || 1, pad = 4;
  const s = canvas.width / (C.width + 2 * pad);
  const X = x => (x + pad) * s, Y = y => (y + pad) * s;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = v('--pitch'); ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = v('--pitch-line'); ctx.lineWidth = Math.max(1, 1.2 * dpr);
  ctx.strokeRect(X(0), Y(0), C.width * s, C.height * s);
  ctx.beginPath(); ctx.moveTo(X(C.width / 2), Y(0)); ctx.lineTo(X(C.width / 2), Y(C.height)); ctx.stroke();
  ctx.beginPath(); ctx.arc(X(C.width / 2), Y(C.height / 2), 9 * s, 0, 2 * Math.PI); ctx.stroke();
  const by0 = (C.height - C.box_width) / 2, gy0 = (C.height - C.goal_width) / 2;
  ctx.strokeRect(X(0), Y(by0), C.box_depth * s, C.box_width * s);
  ctx.strokeRect(X(C.width - C.box_depth), Y(by0), C.box_depth * s, C.box_width * s);
  ctx.fillStyle = v('--goal');
  ctx.fillRect(X(-3), Y(gy0), 3 * s, C.goal_width * s);
  ctx.fillRect(X(C.width), Y(gy0), 3 * s, C.goal_width * s);
  ctx.lineWidth = Math.max(2, 3 * dpr);
  ctx.beginPath(); ctx.moveTo(X(0), Y(gy0)); ctx.lineTo(X(0), Y(gy0 + C.goal_width)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X(C.width), Y(gy0)); ctx.lineTo(X(C.width), Y(gy0 + C.goal_width)); ctx.stroke();

  const fi = idx(), f = F[fi], k = frameTick[fi], tk = T[k];
  if ($('targets').checked && tk.actions.length) {
    const start = F[Math.max(0, tk.f0 - 1)];
    tk.actions.forEach((a, g) => {
      if (!a.target || a.action === 'stay') return;
      const [sx, sy] = start.p[g];
      ctx.save();
      ctx.strokeStyle = a.action === 'pass' ? v('--pass') : (g < N ? v('--team-a') : v('--team-b'));
      ctx.lineWidth = Math.max(1, (a.action === 'pass' ? 1.6 : 1.2) * dpr);

      ctx.beginPath(); ctx.moveTo(X(sx), Y(sy)); ctx.lineTo(X(a.target[0]), Y(a.target[1])); ctx.stroke();

    ctx.beginPath(); ctx.arc(X(x), Y(y), pr, 0, 2 * Math.PI);

  ctx.beginPath(); ctx.arc(X(f.b[0]), Y(f.b[1]), br, 0, 2 * Math.PI);

  if ($('shouts').checked) {
    ctx.font = `500 ${Math.round(11 * dpr)}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    const hits = (cx, cy, w) => placed.some(r => Math.abs(r.cx - cx) < (r.w + w) / 2 + gap && Math.abs(r.cy - cy) < h + gap);
    tk.actions.forEach((a, g) => {
      if (!a.say) return;
      const text = a.say.length > 42 ? a.say.slice(0, 41) + '…' : a.say;
      const [x, y] = f.p[g], w = ctx.measureText(text).width + 10 * dpr;
      const cx = Math.min(Math.max(X(x), w / 2 + 2), canvas.width - w / 2 - 2);
      // Start just above the speaker and step away (up first, then down) until the label is clear.
      const base = Y(y) - pr - h;
      let cy = base;
      for (let k = 1; k < 40 && (hits(cx, cy, w) || cy < h / 2 + 2 || cy > canvas.height - h / 2 - 2); k++) {
        cy = base + (k % 2 ? -1 : 1) * Math.ceil(k / 2) * (h + gap);
      }
      placed.push({ cx, cy, w });
      ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = dpr;
      ctx.beginPath(); ctx.moveTo(X(x), Y(y) - pr); ctx.lineTo(Math.min(Math.max(X(x), cx - w / 2), cx + w / 2), cy + (cy < Y(y) ? h / 2 : -h / 2)); ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,.72)';
      ctx.beginPath(); ctx.roundRect(cx - w / 2, cy - h / 2, w, h, 4 * dpr); ctx.fill();
      ctx.fillStyle = g < N ? v('--team-a') : v('--team-b'); ctx.fillRect(cx - w / 2, cy - h / 2, 3 * dpr, h);
      ctx.fillStyle = '#fff'; ctx.fillText(text, cx + 1.5 * dpr, cy + 0.5);
    });
  }

  $('score').textContent = `${frameScore[fi][0]} - ${frameScore[fi][1]}`;
  $('clock').textContent = `tick ${Math.max(0, tk.tick)} / ${C.max_ticks}`;
  scrub.value = fi;
  renderActions(k);
}

let shownTick = -2;
function renderActions(k) {
  if (k === shownTick) return; shownTick = k;
  const tk = T[k], el = $('actions');
  for (const s of ['A', 'B']) {
    const box = $('chat' + s), off = s === 'A' ? 0 : N;
    $('chatTitle' + s).textContent = tk.tick < 0 ? `Team ${s} shouts` : `Team ${s} shouts · tick ${tk.tick}`;
    const lines = tk.actions.slice(off, off + N).map((a, i) => ({ who: names[off + i], say: a.say }));
    box.innerHTML = !tk.actions.length ? '<div class="line quiet"><span></span><span class="what">Kickoff</span></div>'
      : lines.map(l => `<div class="line${l.say ? '' : ' quiet'}"><span class="who">${l.who}</span><span class="what">${l.say ? esc(l.say) : 'no shout'}</span></div>`).join('');
  }
  $('actionsTitle').textContent = tk.tick < 0 ? 'Actions' : `Actions · tick ${tk.tick}`;
  el.innerHTML = '';
  if (!tk.actions.length) { el.innerHTML = '<div class="row"><span></span><span class="muted">Kickoff</span></div>'; return; }
  tk.actions.forEach((a, g) => {
    const r = document.createElement('div'); r.className = 'row';
    const what = a.error ? `<span class="err">${esc(a.error)}</span>`
      : `${a.action}${a.target ? ` → (${a.target[0].toFixed(1)}, ${a.target[1].toFixed(1)})` : ''}`;
    const said = a.say ? `<br><span class="say">“${esc(a.say)}”</span>` : '';
    r.innerHTML = `<span><span class="tag" style="background:var(${g < N ? '--team-a' : '--team-b'})"></span>${names[g]}</span><span>${what}${said}<br><span class="muted" style="font-size:11px">${esc(a.agent || '')}</span></span>`;
    el.appendChild(r);
  });
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderEvents() {
  const el = $('events'), keep = new Set(['goal', 'tackle', 'interception']);
  let any = false;
  T.forEach((tk, k) => tk.events.forEach(e => {
    if (!keep.has(e.type)) return; any = true;
    const r = document.createElement('div'); r.className = 'row click' + (e.type === 'goal' ? ' goal' : '');
    let text;
    if (e.type === 'goal') text = `GOAL ${e.team}${e.own_goal ? ' (own goal by ' + e.player + ')' : e.player ? ' · ' + e.player : ''} · ${e.score[0]}-${e.score[1]}`;
    else text = `${e.type} by ${e.player}${e.from ? ' from ' + e.from : ''}`;
    r.innerHTML = `<span class="t">t${tk.tick}</span><span>${esc(text)}</span>`;
    r.onclick = () => { pause(); pos = tk.f0; draw(); };
    el.appendChild(r);
  }));
  const passes = T.reduce((n, tk) => n + tk.events.filter(e => e.type === 'pass').length, 0);
  const errs = T.reduce((n, tk) => n + tk.actions.filter(a => a.error).length, 0);
  const said = T.reduce((n, tk) => n + tk.actions.filter(a => a.say).length, 0);
  const foot = document.createElement('div'); foot.className = 'row';
  foot.innerHTML = `<span></span><span class="muted">${passes} passes · ${said} shouts · ${errs} failed or invalid actions</span>`;
  if (!any) el.innerHTML = '';
  el.appendChild(foot);
}

function frame(ts) {
  if (!playing) return;
  // rAF timestamps can precede the performance.now() taken in play(), so clamp at zero.
  const dt = Math.max(0, (ts - last) / 1000); last = ts;
  if (ts < holdUntil) { requestAnimationFrame(frame); return; }
  if (restart) { restart = false; pos = 0; }
  const from = idx();
  pos = Math.min(F.length - 1, pos + dt * C.substeps * Number($('speed').value));
  // Stop on a goal frame the playback just passed, and hold it for a moment in real time.
  for (let i = from + 1; i <= idx(); i++) {
    if (goalFrames.has(i)) { pos = i; holdUntil = ts + GOAL_HOLD_MS; break; }
  }
  draw();
  // Loop: hold the final frame briefly, then start the game again.
  if (pos >= F.length - 1) { holdUntil = ts + 1500; restart = true; }
  requestAnimationFrame(frame);
}
function play() {
  if (idx() >= F.length - 1) pos = 0;
  playing = true; $('play').textContent = 'Pause';
  last = performance.now(); requestAnimationFrame(frame);
}
function pause() { playing = false; pos = idx(); $('play').textContent = 'Play'; }
function stepTick(d) { pause(); const k = Math.min(T.length - 1, Math.max(0, frameTick[idx()] + d)); pos = T[k].f0; draw(); }
$('play').onclick = () => playing ? pause() : play();
$('prev').onclick = () => stepTick(-1);
$('next').onclick = () => stepTick(1);
// Keep focus off the buttons so space/arrows always reach the shortcuts below.
document.querySelectorAll('button').forEach(b => b.addEventListener('mousedown', e => e.preventDefault()));
scrub.oninput = () => { pause(); pos = Number(scrub.value); draw(); };
$('targets').onchange = draw;
$('shouts').onchange = draw;
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'SELECT' || (tag === 'INPUT' && e.target.type === 'range')) return;
  if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); stepTick(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); stepTick(1); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
window.addEventListener('resize', resize);
renderEvents(); resize();
if (new URLSearchParams(location.search).has('autoplay')) play();
</script>
</body>
</html>
